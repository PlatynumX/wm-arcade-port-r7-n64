name: build

on:
  push:
    branches-ignore: [rom-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The N64 job publishes the finished ROM to the quota-free rom-build branch.
permissions:
  contents: write

jobs:
  host-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable verifier
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
      - name: Build portable verifier
        run: cmake --build build-host --parallel
      - name: Run tests
        run: ctest --test-dir build-host --output-on-failure
      - name: Run translated-source smoke test
        run: ./build-host/wm_headless

  source-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch historical source and regenerate translated source data
        run: sh ./scripts/regenerate_source_data.sh
      - name: Verify checked-in animation data is reproducible
        run: git diff --exit-code -- src/generated/finish_sequences.c src/generated/bret_visuals.c src/generated/bret_attacks.c
      - name: Convert real Bret WIMP frames to portable C
        run: sh ./scripts/prepare_bret_sprites.sh
      - name: Compile generated sprite source on host
        run: cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/generated/bret_sprites.c -o /tmp/bret_sprites.o
      - name: Show generated artwork footprint
        run: |
          wc -c src/generated/bret_sprites.c
          grep -c '^    {"H' src/generated/bret_sprites.c

  n64-rom:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dragonminded/libdragon:trunk
    env:
      N64_INST: /n64_toolchain
      LIBDRAGON_REV: 0c665e8439aba143424631ba29ef2c305eaa986b
    steps:
      - uses: actions/checkout@v4

      - name: Ensure host-side asset tools exist
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3
          fi
          python3 --version
          git --version
          make --version | head -1

      - name: Install libdragon SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "N64_INST=$N64_INST"
          test -x "$N64_INST/bin/mips64-elf-gcc"
          rm -rf /tmp/libdragon
          git init -q /tmp/libdragon
          git -C /tmp/libdragon remote add origin https://github.com/DragonMinded/libdragon.git
          git -C /tmp/libdragon fetch -q --depth 1 origin "$LIBDRAGON_REV"
          git -C /tmp/libdragon checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/libdragon rev-parse HEAD)" = "$LIBDRAGON_REV"
          make -C /tmp/libdragon -j2 install
          make -C /tmp/libdragon -j2 tools-install
          test -f "$N64_INST/include/n64.mk"
          test -f "$N64_INST/mips64-elf/lib/libdragon.a"
          test -x "$N64_INST/bin/n64tool"

      - name: Generate real Bret sprite source
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/regenerate_source_data.sh
          sh ./scripts/prepare_bret_sprites.sh
          test -s src/generated/bret_sprites.c

      - name: Build Nintendo 64 ROM
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/n64 wm_arcade_r7h2.z64
          make -j2
          test -s wm_arcade_r7h2.z64
          ls -lh wm_arcade_r7h2.z64

      - name: Publish ROM to rom-build branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROM="$GITHUB_WORKSPACE/wm_arcade_r7h2.z64"
          test -s "$ROM"
          cp "$ROM" /tmp/wm_arcade_r7h2.z64

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Use an orphan branch so the public ROM branch contains only build output.
          git checkout --orphan rom-build-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/wm_arcade_r7h2.z64 ./wm_arcade_r7h2.z64
          {
            echo "WrestleMania Arcade N64 r7h2"
            echo "source_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD.txt
          git add -f wm_arcade_r7h2.z64 BUILD.txt
          git commit -m "ROM build ${GITHUB_SHA::12}"
          git push --force origin HEAD:rom-build
